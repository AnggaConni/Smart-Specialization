name: S3 Radar CI

on:
  push:
    paths:
      - "radar.html"
      - "radar.js"
      - "pipeline/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - "data/radar-data.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "radar.html"
      - "radar.js"
      - "pipeline/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - "data/radar-data.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test collector, markup and dashboard JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and HTML checks
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: node --check radar.js
      - name: Validate JSON snapshots and config
        run: python -c "import json,pathlib; files=list(pathlib.Path('config').rglob('*.json'))+list(pathlib.Path('data').rglob('*.json')); [json.loads(p.read_text(encoding='utf-8')) for p in files]; print(f'Validated {len(files)} JSON files')"
